<script>
const DATA=JSON.parse(document.getElementById('DATA').textContent);
const COUNTRY=JSON.parse(document.getElementById('COUNTRY').textContent);
const COLORS=JSON.parse(document.getElementById('COLORS').textContent);
let TAB='news', Q='', CC='', VSTATUS='';
const $=s=>document.querySelector(s);

function init(){
  const sel=$('#country');
  Object.entries(COUNTRY).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v;sel.appendChild(o)});
  $('#q').addEventListener('input',e=>{Q=e.target.value.trim().toLowerCase();render()});
  sel.addEventListener('change',e=>{CC=e.target.value;render()});
  $('#genTime').textContent='更新于 '+DATA.generated;
  $('#genTime2').textContent=DATA.generated;
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  render();
}
function setTab(t){TAB=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#chips').style.display=t==='vehicles'?'flex':'none';$('#stats').style.display=t==='vehicles'?'flex':'none';render();}
function hit(text){return !Q||(text||'').toLowerCase().includes(Q);}
function czh(c){return COUNTRY[c]||c;}
function srcLinks(v,extra){
  let out='';
  const name=v.source||'', url=v.source_url||'';
  if(url) out+=`<a class="src" href="${url}" target="_blank" rel="noopener">🔗 出处：${name||url}</a>`;
  if(v.published) out+=`<span class="badge">📅 ${v.published}</span>`;
  if(v.deadline) out+=`<span class="badge red">⏰ 截止 ${v.deadline}</span>`;
  (extra||'').split('|').filter(Boolean).forEach(x=>out+=`<span class="badge blu">${x}</span>`);
  return `<div class="meta">${out}</div>`;
}
function itemCard(v,kind){
  const title=v.title_zh||v.title_raw||'(未翻译)';
  const raw=v.title_zh?v.title_raw:'';
  const sum=v.summary_zh||v.summary_raw||'';
  let extra='';
  if(kind==='tender'){if(v.agency)extra+=`|🏦 ${v.agency}`;if(v.amount)extra+=`|💵 ${v.amount}`;
    if(!v.published&&v.created_at)extra+=`|📥 抓取 ${(v.created_at||'').slice(0,10)}`;}
  if(kind==='loan'){if(v.financier)extra+=`|🏦 ${v.financier}`;if(v.amount)extra+=`|💵 ${v.amount}`;if(v.project_no)extra+=`|№ ${v.project_no}`;if(v.status)extra+=`|📍 ${v.status}`;}
  return `<div class="card"><h3>${title}</h3>${raw?`<div class="raw">原文：${raw}</div>`:''}${sum?`<div class="sum">${sum}</div>`:''}${srcLinks(v,extra)}</div>`;
}
function vehicleCard(v){
  const color=COLORS[v.status]||'#656d76';
  let sources='';try{sources=JSON.parse(v.sources||'[]')}catch(e){}
  const links=sources.filter(s=>s&&s.url).map(s=>`<a class="src" href="${s.url}" target="_blank" rel="noopener">🔗 ${s.name}</a>`).join(' ')
    + sources.filter(s=>s&&!s.url).map(s=>`<span class="src" style="color:var(--mut)">📄 ${s.name}</span>`).join(' ');
  const body=`<div class="vbody"><h3>${v.model} <span class="badge" style="background:${color}22;color:${color}">${v.status}</span></h3>
  <div class="raw">${v.operator}${v.line?' · '+v.line:''}（${czh(v.country)}）</div>
  <div class="kv">
    <div><b>车型</b>${v.model}</div><div><b>生产厂家</b>${v.manufacturer||'—'}</div>
    <div><b>生产时间</b>${v.build_year||'—'}</div><div><b>数量</b>${v.quantity||'—'}</div>
    <div><b>购买价格</b>${v.price||'未公开'}${v.price_note?`<div class="raw" style="margin-top:2px">${v.price_note}</div>`:''}</div>
    <div><b>改造情况</b>${v.refurbishment||'—'}</div>
    ${v.retired_date?`<div><b>退役时间</b>${v.retired_date}</div>`:''}
  </div>
  ${v.summary_zh?`<div class="sum">${v.summary_zh}</div>`:''}<div class="meta">${links}</div></div>`;
  const img=v.image_url?`<img class="vimg" src="${v.image_url}" loading="lazy" alt="${v.model}"
    onerror="this.style.display='none'">`:'';
  return `<div class="card"><div class="vwrap">${img}${body}</div></div>`;
}
function coopCard(v){
  let sources='';try{sources=JSON.parse(v.sources||'[]')}catch(e){}
  const links=sources.filter(s=>s&&s.url).map(s=>`<a class="src" href="${s.url}" target="_blank" rel="noopener">🔗 ${s.name}</a>`).join(' ')
    + sources.filter(s=>s&&!s.url).map(s=>`<span class="src" style="color:var(--mut)">📄 ${s.name}</span>`).join(' ');
  return `<div class="card"><h3>${v.name_zh} <span class="badge">${czh(v.country)}</span></h3>
  <div class="kv">
    <div><b>中方参与</b>${v.partner_zh||'—'}</div>
    <div><b>类型</b>${v.coop_type||'—'}</div>
    <div><b>金额/投资</b>${v.amount||'—'}</div>
    <div><b>关键年份</b>${v.year||'—'}</div>
    <div><b>状态</b>${v.status||'—'}</div>
  </div>
  ${v.summary_zh?`<div class="sum">${v.summary_zh}</div>`:''}
  <div class="meta">${links}</div></div>`;
}
function instCard(v){
  return `<div class="card"><h3>${v.name_zh} <span class="badge">${czh(v.country)}${v.city?' · '+v.city:''}</span></h3>
  ${v.name_en?`<div class="raw">${v.name_en}${v.name_native?' · '+v.name_native:''}</div>`:''}
  <div class="kv">${v.programs?`<div><b>专业/方向</b>${v.programs}</div>`:''}${v.partners?`<div><b>合作项目</b>${v.partners}</div>`:''}</div>
  ${v.note?`<div class="sum">${v.note}</div>`:''}
  ${v.url?`<div class="meta"><a class="src" href="${v.url}" target="_blank" rel="noopener">🔗 官网</a></div>`:''}</div>`;
}
function render(){
  let html='',n=0;
  const stat=$('#stats'),chips=$('#chips');
  if(TAB==='vehicles'){
    let st;
    if(CC){ st=DATA.vehicle_stats[CC]||{}; }
    else { st={}; Object.values(DATA.vehicle_stats).forEach(s=>Object.entries(s).forEach(([k,v])=>st[k]=(st[k]||0)+v)); }
    stat.innerHTML=`<div><b>${st['在役']||0}</b>在役记录</div><div><b>${st['退役']||0}</b>退役记录</div><div><b>${st['部分退役']||0}</b>部分退役</div><div><b>${st['封存']||0}</b>封存</div><div><b>${st['采购中']||0}</b>采购中</div>`;
    const chipsAll=['','在役','退役','部分退役','封存','采购中'];
    chips.innerHTML=chipsAll.map(c=>`<button class="chip ${VSTATUS===c?'on':''}" data-c="${c}">${c||'全部状态'}</button>`).join('');
    chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{VSTATUS=b.dataset.c;render()});
  } else {chips.style.display='none';stat.style.display='none';}
  if(['news','tenders','loans'].includes(TAB)){
    const arr=(DATA[TAB]||[]).filter(v=>(!CC||v.country===CC)&&hit(v.title_zh+' '+v.title_raw+' '+(v.summary_zh||'')+' '+(v.summary_raw||'')));
    n=arr.length;
    const label={news:'条动态',tenders:'个招投标项目',loans:'个贷款/资助项目'}[TAB];
    html+=`<h2 class="sec">共 ${n} ${label}${CC?` · ${czh(CC)}`:''}${Q?` · 关键词“${Q}”`:''}</h2>`;
    html+=arr.map(v=>itemCard(v,TAB==='tenders'?'tender':TAB==='loans'?'loan':'news')).join('')||'<p class="note">暂无数据——请等待首轮抓取完成后刷新本页。</p>';
  } else if(TAB==='vehicles'){
    const arr=DATA.vehicles.filter(v=>(!CC||v.country===CC)&&(!VSTATUS||v.status===VSTATUS||VSTATUS==='在役'&&v.status.startsWith('在役'))&&hit(v.model+' '+v.operator+' '+(v.summary_zh||'')+' '+(v.manufacturer||'')));
    html+=`<h2 class="sec">车辆档案 ${arr.length} 条（统计以本库已核实收录为准，非运营全量数据）</h2>`+arr.map(vehicleCard).join('');
  } else if(TAB==='institutions'){
    const arr=DATA.institutions.filter(v=>(!CC||v.country===CC)&&hit(v.name_zh+' '+(v.name_en||'')+' '+(v.programs||'')+' '+(v.partners||'')+' '+(v.note||'')));
    html+=`<h2 class="sec">院校与培训机构 ${arr.length} 所</h2>`+arr.map(instCard).join('');
  } else if(TAB==='coop'){
    const arr=DATA.coop.filter(v=>(!CC||v.country===CC)&&hit(v.name_zh+' '+(v.partner_zh||'')+' '+(v.summary_zh||'')+' '+(v.coop_type||'')+' '+(v.status||'')));
    html+=`<h2 class="sec">中国 × GMS/东盟 轨道交通合作项目 ${arr.length} 个（近10年）</h2>`+arr.map(coopCard).join('');
  } else if(TAB==='portals'){
    const CAT={A:'🏛 国家门户',B:'🏢 业主/主管机构',C:'🏦 国际融资机构'};
    const GLOSS='常见缩写：e-GP=电子政府采购系统 ｜ ICB=国际竞争性招标 ｜ NCB=国内竞争性招标 ｜ OTM=公开招标法 ｜ G2G=政府间框架协议 ｜ RFP=征求意见书 ｜ PPP=政府和社会资本合作 ｜ O&M=运营与维护 ｜ EPC=设计-采购-施工总承包 ｜ TKDN=印尼国产化率 ｜ MDB=多边开发银行 ｜ SOE=国有企业 ｜ RSS=订阅源';
    const arr=DATA.portals.filter(v=>(!CC||v.country===CC)&&hit(v.name+' '+(v.note||'')+' '+(v.ptype||'')));
    html+=`<div class="card" style="background:var(--brand2);border-color:var(--brand)"><div style="font-size:12.5px;line-height:1.8">${GLOSS}</div></div>`;
    html+=`<h2 class="sec">各国轨交装备招投标发布渠道 ${arr.length} 个（建议每周人工巡检；G2G 类项目不走公开招标）</h2>`;
    let lastCountry='';
    arr.forEach(v=>{
      if(v.country!==lastCountry){html+=`<h2 class="sec" style="margin-top:14px">—— ${czh(v.country)} ——</h2>`;lastCountry=v.country;}
      html+=`<div class="card"><h3>${v.name} <span class="badge">${CAT[v.cat]||v.cat}</span></h3>
      <div class="sum">${v.note||''}</div><div class="meta"><a class="src" href="${v.url}" target="_blank" rel="noopener">🔗 打开门户：${v.url}</a></div></div>`;
    });
  } else if(TAB==='contacts'){
    const arr=DATA.contacts.filter(v=>(!CC||v.country===CC)&&hit(v.org+' '+(v.email||'')+' '+(v.purpose||'')));
    html+=`<h2 class="sec">各国采购对接邮箱 ${arr.length} 条（仅收录公开核实来源；邮箱可能有变动，正式函件前请在官网复核）</h2>`;
    let lastCountry='';
    arr.forEach(v=>{
      if(v.country!==lastCountry){html+=`<h2 class="sec" style="margin-top:14px">—— ${czh(v.country)} ——</h2>`;lastCountry=v.country;}
      const isMail=/^[^@]+@[^@]+\.[^@]+$/.test(v.email||'');
      const emailHtml=isMail?`<a class="src" href="mailto:${v.email}">📧 ${v.email}</a>`:`<span class="src" style="color:var(--mut)">📮 ${v.email}</span>`;
      html+=`<div class="card"><h3>${v.org} <span class="badge">${czh(v.country)}</span></h3>
      <div class="meta" style="margin:8px 0">${emailHtml}${v.url?`<a class="src" href="${v.url}" target="_blank" rel="noopener">🔗 官网/平台</a>`:''}</div>
      ${v.purpose?`<div class="sum">${v.purpose}</div>`:''}</div>`;
    });
  } else if(TAB==='factories'){
    const CAT={'主机厂':'🏭 主机厂','配件厂':'⚙️ 配件厂','设备厂':'🔧 设备厂','检修基地':'🛠 检修基地','中车系':'🇨🇳 中车系'};
    const arr=DATA.factories.filter(v=>(!CC||v.country===CC)&&hit(v.company+' '+(v.parent||'')+' '+(v.business||'')+' '+(v.city||'')+' '+(v.category||'')));
    html+=`<h2 class="sec">各国在地轨交厂商/基地 ${arr.length} 家（主机厂 · 配件厂 · 设备厂 · 检修基地 · 中国中车系布局）</h2>`;
    let lastCountry='';
    arr.forEach(v=>{
      if(v.country!==lastCountry){html+=`<h2 class="sec" style="margin-top:14px">—— ${czh(v.country)} ——</h2>`;lastCountry=v.country;}
      let sources='';try{sources=JSON.parse(v.sources||'[]')}catch(e){}
      const links=sources.filter(s=>s&&s.url).map(s=>`<a class="src" href="${s.url}" target="_blank" rel="noopener">🔗 ${s.name}</a>`).join(' ');
      html+=`<div class="card"><h3>${v.company} <span class="badge blu">${CAT[v.category]||v.category}</span></h3>
      <div class="raw">${v.parent?'母公司：'+v.parent+' ｜ ':''}${v.city?'所在地：'+v.city+' ｜ ':''}${v.year?'设立/投产：'+v.year:''}</div>
      ${v.business?`<div class="sum">${v.business}</div>`:''}<div class="meta">${links}</div></div>`;
    });
  } else if(TAB==='health'){
    const arr=DATA.sources.filter(v=>hit(v.name+' '+(v.country||'')));
    html+=`<h2 class="sec">源站抓取健康状态（最近一次运行）</h2><table><tr><th>源站</th><th>国家</th><th>类别</th><th>最近运行</th><th>状态</th><th>抓取条数</th></tr>`+
      arr.map(v=>`<tr><td>${v.name}</td><td>${czh(v.country)}</td><td>${{news:'新闻',tender:'招投标',loan:'贷款/资助'}[v.type]||v.type}</td><td>${v.last_run||'—'}</td><td class="${v.last_status==='ok'?'ok':'fail'}">${v.last_status==='ok'?'✅ 正常':'❌ '+(v.last_status||'')}</td><td>${v.last_count??'—'}</td></tr>`).join('')+'</table>';
    html+=`<h2 class="sec" style="margin-top:18px">运行日志（最近14次）</h2><table><tr><th>完成时间</th><th>新增条目</th><th>说明</th></tr>`+
      (DATA.runs||[]).map(v=>`<tr><td>${v.finished}</td><td>${v.new_items}</td><td>${v.note||''}</td></tr>`).join('')+'</table>';
    html+=`<p class="note">提示：某源站长期 ❌ 时，多为网络视角问题（外媒需代理、国内站需直连），可调整 config.yaml 中的代理设置。</p>`;
  }
  $('#list').innerHTML=html;
}
init();
</script>
</body>
</html>
